# ---------------------------------------------------------------------------
# knowhub 前台 Nginx 配置（挂到 /etc/nginx/conf.d/knowhub-portal.conf）
# ---------------------------------------------------------------------------
# 前台 SPA：history 模式深链刷新需回退 index.html；
# /api、/file 同名转发到后端服务（compose 服务名 backend:8080）。
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;

    # 前台静态产物根目录（Dockerfile 已把 dist 拷到这里）
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩：减小 SPA 首屏 JS/CSS 传输体积
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # /api 前缀转发到后端：后端 controller 路径无 /api 前缀，故此处 rewrite 剥掉
    # （与 vite dev proxy 的 rewrite: path.replace(/^\/api/, '') 同口径）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文件上传/中转可能较大，放宽代理超时与体积
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        client_max_body_size 50m;
    }

    # /file 前缀转发到后端：文件回显/中转下载/中转上传等（后端 controller 本身带 /file 前缀，不剥）
    # <img src="/file/resolve/{id}"> 由浏览器直发，必须经此 location 命中后端，否则裂图
    location /file/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        client_max_body_size 50m;
    }

    # 静态资源长缓存（vite 产物带 hash 文件名，可安全强缓存）
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA history 模式回退：任何未命中静态文件的路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
