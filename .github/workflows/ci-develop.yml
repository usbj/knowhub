name: Validate develop pull request

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: knowhub-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Java backend and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            knowhub-ui/package-lock.json
            rookie-ui/package-lock.json

      - name: Check and build knowhub-ui
        working-directory: knowhub-ui
        run: |
          npm ci
          npm run type-check
          npm run build-only

      - name: Check and build rookie-ui
        working-directory: rookie-ui
        run: |
          npm ci
          npm run type-check
          npm run build-only
