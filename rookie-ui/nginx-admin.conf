# ---------------------------------------------------------------------------
# rookie 后台管理 Nginx 配置（挂到 /etc/nginx/conf.d/knowhub-admin.conf）
# ---------------------------------------------------------------------------
# 后台 SPA：history 模式深链刷新需回退 index.html；
# /api、/file 同名转发到后端服务（compose 服务名 backend:8080）。
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # /api 前缀转发到后端：剥掉 /api 前缀（与 vite dev proxy rewrite 同口径）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        client_max_body_size 50m;
    }

    # /file 前缀转发到后端：文件模块所有接口走 /file（public/proxy/proxy-upload/list 等，不剥前缀）
    location /file/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        client_max_body_size 50m;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
