<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookie Admin - Login</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="login-page">
    <section class="login-stage">
      <aside class="login-aside">
        <p class="section-kicker">Rookie</p>
        <h1>后台系统登录</h1>
        <p class="login-copy">
          这一版登录页不走营销海报风，而是直接传达“系统入口”的秩序感。
          左侧强调平台能力，右侧是清晰直接的登录动作。
        </p>
        <div class="login-metric-grid">
          <div class="login-metric"><p>统一认证</p><strong>账号体系集中管理</strong></div>
          <div class="login-metric"><p>权限控制</p><strong>角色与菜单联动</strong></div>
          <div class="login-metric"><p>操作审计</p><strong>关键动作可追溯</strong></div>
          <div class="login-metric"><p>界面偏好</p><strong>支持个性设置保存</strong></div>
        </div>
      </aside>

      <div class="login-panel">
        <p class="section-kicker">Sign In</p>
        <h2>欢迎回来</h2>
        <p class="subtle">请输入账号信息进入 Rookie 管理后台</p>

        <div class="login-field">
          <label>账号</label>
          <div class="input-mock">请输入用户名 / 手机号 / 邮箱</div>
        </div>
        <div class="login-field">
          <label>密码</label>
          <div class="input-mock">请输入密码</div>
        </div>
        <div class="login-field">
          <label>验证码</label>
          <div class="captcha-row">
            <div class="input-mock">请输入验证码</div>
            <div class="captcha-box">3A7K</div>
          </div>
        </div>

        <div class="login-actions">
          <span class="chip">记住登录状态</span>
          <span class="chip">短信验证备用</span>
        </div>

        <div style="margin-top:18px;">
          <button class="primary-button" style="width:100%; min-height:44px;">登录系统</button>
        </div>
      </div>
    </section>
  </body>
</html>
